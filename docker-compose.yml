services:
  auto-video-editor:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Must be set in .env -- there is no default provider. Set these 3
      # vars to match whichever OpenAI-compatible AI provider you want to
      # use right now.
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_MODEL=${AI_MODEL}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
